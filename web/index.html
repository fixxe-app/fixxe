<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>FIXXE</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png?v=37">
<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FIXXE">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=37">
<link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
<div id="app">
  <!-- Header -->
  <header class="header">
    <button id="btnSettings" class="icon-btn" title="Settings"><svg viewBox="0 0 24 24" width="24" height="24" class="line" aria-hidden="true"><path d="M19.27 9.78 L21.82 10.09 L21.82 13.91 L19.27 14.22 L18.71 15.57 L20.29 17.59 L17.59 20.29 L15.57 18.71 L14.22 19.27 L13.91 21.82 L10.09 21.82 L9.78 19.27 L8.43 18.71 L6.41 20.29 L3.71 17.59 L5.29 15.57 L4.73 14.22 L2.18 13.91 L2.18 10.09 L4.73 9.78 L5.29 8.43 L3.71 6.41 L6.41 3.71 L8.43 5.29 L9.78 4.73 L10.09 2.18 L13.91 2.18 L14.22 4.73 L15.57 5.29 L17.59 3.71 L20.29 6.41 L18.71 8.43 Z M15 12 A3 3 0 1 1 9 12 A3 3 0 1 1 15 12 Z"/></svg></button>
    <button id="btnRefresh" class="icon-btn" title="Refresh"><svg viewBox="0 0 24 24" width="24" height="24" class="line" aria-hidden="true"><path d="M4.5 12A7.5 7.5 0 0 1 17.3 6.7L19.5 9M19.5 4.5V9H15M19.5 12A7.5 7.5 0 0 1 6.7 17.3L4.5 15M4.5 19.5V15H9"/></svg></button>
    <!-- «Рыночный курс · 13:11 · источник ⓘ» — нажатие открывает пояснение о курсах -->
    <button id="status" class="status"></button>
  </header>

  <!-- Brand · mini-logo · Clear -->
  <div class="clear-row">
    <span class="brand">FIXXE</span>
    <img class="mini-logo" src="icons/logo-mini.png?v=37" alt="">
    <button id="btnClear" class="clear-btn">CLEAR</button>
  </div>

  <!-- Поправка к курсу включена: полоса не закрывается, пока процент не ноль -->
  <button id="adjustBanner" class="adjust-banner" hidden><span class="pct" aria-hidden="true">%</span><span id="adjustBannerText"></span><span class="chev" aria-hidden="true">›</span></button>
  <div id="adjustNotice" class="adjust-notice" role="status" hidden><span id="adjustNoticeText"></span><button id="adjustUndo"></button></div>

  <!-- List -->
  <main id="list" class="list"></main>

  <!-- Footer: одна строка. Подпись ExchangeRate-API — только когда курсы от него
       (условие их бесплатного тарифа); номер версии и APK — в настройках. -->
  <footer class="footer">
    <div class="footer-top">
      <button id="btnAdd" class="add-btn"><svg viewBox="0 0 24 24" width="18" height="18" class="line" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span id="btnAddText"></span></button>
      <a id="attribution" class="attribution" href="https://www.exchangerate-api.com" target="_blank" rel="noopener" hidden>Rates By Exchange Rate API</a>
    </div>
  </footer>
</div>

<!-- Modal host -->
<div id="modal-root"></div>

<script src="i18n.js?v=3"></script>
<script src="currency-data.js?v=3"></script>
<script src="app.js?v=3"></script>
</body>
</html>
