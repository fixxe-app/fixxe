promotional_text: Fem kurskällor med automatiskt byte, offlinekurser som varnar när de blivit gamla och avrundning som inte förstör små belopp.
description: 'FIXXE är en snabb och ren valutaomvandlare med aktuella mittkurser — den neutrala mittpunkten mellan världens köp- och säljpriser, utan bankpåslag.


  DET HÄR SKILJER FIXXE


  • Fem kurskällor med automatiskt byte — Coinbase, FXRatesAPI, ExchangeRate-API, F.A. och Frankfurter (ECB). Livekurserna stämmer med referenskurserna du ser i webbsökningar och på stora valutasajter. Om en leverantör ligger nere byter appen automatiskt till nästa och visar varifrån siffrorna kommer. De flesta omvandlare hänger på ett enda API och visar helt enkelt ingenting när det fallerar. Föredrar du en enda källa? Välj den i Inställningar — de andra finns kvar som reserv.


  • Fungerar offline — de senaste kurserna sparas på enheten, så appen fortsätter räkna utan uppkoppling. Och är kurserna äldre än ett dygn säger den det rakt ut i stället för att låtsas att de är färska.


  • Smart avrundning — den precision du väljer är ett minimum, inte en tvångströja: skulle avrundningen snedvrida beloppet med mer än 2% läggs decimaler till av sig själva. 0,94 CHF blir aldrig ”1”, och små kryptobelopp faller aldrig till noll. Du väljer själv hur belopp avrundas: uppåt, så att det visade beloppet aldrig är lägre än det verkliga och pengarna alltid räcker, eller till närmaste.


  • Dynamisk bas — kurserna räknas om mot den valuta du redigerar, inte mot en fast. Inget växlande fram och tillbaka.


  • Kommer ihåg beloppet — stäng appen så finns talet du skrev kvar när du kommer tillbaka. Välj i inställningarna hur länge: 12 eller 24 timmar, alltid eller bara medan appen är öppen.


  • Kursjustering — ange en procentsats för bankens avgift, marginal eller överföringsförluster (till exempel +1,5 %) så visar alla belopp direkt det verkliga resultatet. Justerade siffror är tydligt markerade, så du aldrig förväxlar dem med marknadskursen. Om du inte har den alltid på stänger den av sig själv efter fyra timmar utan användning, så att en bortglömd avgift aldrig snedvrider morgondagens siffror.


  • Ingen reklam. Inga konton. Ingen spårning. Enda behörigheten är internetåtkomst; din lista, dess ordning och dina inställningar lämnar aldrig enheten.


  VALUTOR


  • 300+ valutor med landsflaggor

  • Regionala valutor som omvandlare ofta hoppar över: rysk rubel, serbisk dinar, georgisk lari, tadzjikisk somoni, kirgizisk som

  • Krypto — Bitcoin, Ethereum och 150+ till — samt ädelmetaller


  VARDAGSDETALJER


  • Skriv i vilket fält som helst så uppdateras alla andra valutor direkt

  • Dra rader i handtaget för att ordna om dem, ta bort en med en tryckning

  • Källmedveten sökning: filtrera valutor per leverantör, se var varje valuta finns, byt källa med en tryckning

  • Precision: heltal, 1, 2 eller 4 decimaler

  • Tusentalsavgränsare med mellanslag eller komma: 1 234.56 eller 1,234.56

  • Ljust eller mörkt tema, eller följ systemet

  • 40 språk, engelska som standard, med möjlighet att följa enhetens språk — layouter från höger till vänster inkluderade

  • Telefon, surfplatta och webb: samma app på iPhone, iPad, Android och som webbapp du kan lägga på hemskärmen


  Visade kurser är vägledande mittkurser, inte handelskurser i realtid.

  En av reservkällorna för kurser: Rates By Exchange Rate API.

  '
