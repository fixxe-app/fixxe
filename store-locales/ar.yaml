title: "FIXXE – محول العملات"
subtitle: أسعار من ثلاثة مصادر
short_description: أسعار وسطية من 3 مصادر، 300+ عملة، تعمل دون اتصال، بلا إعلانات.
keywords: عملة,محول,صرف,سعر,مال,سفر,فوركس,عملات رقمية,مالية,يورو
promotional_text: ثلاثة مصادر للأسعار مع تبديل تلقائي، أسعار دون اتصال مع تنبيه عند تقادمها، وتقريب ذكي يحفظ المبالغ الصغيرة.
description: '‏FIXXE محوّل عملات سريع وأنيق بأسعار السوق الوسطية الحية — النقطة المحايدة بين أسعار الشراء والبيع العالمية، بلا هوامش مصرفية.


  ما الذي يميز FIXXE


  • ثلاثة مصادر للأسعار مع تبديل تلقائي — ExchangeRate-API وF.A. وFrankfurter (البنك المركزي الأوروبي). إذا تعطّل مزوّد، ينتقل التطبيق بهدوء إلى التالي ويبيّن من أين جاءت الأرقام. معظم المحوّلات تعتمد على واجهة واحدة ولا تعرض شيئًا عند تعطّلها.


  • يعمل دون اتصال — تبقى آخر الأسعار على جهازك، فيواصل التطبيق الحساب بلا شبكة. وإذا مضى على تلك الأسعار أكثر من يوم، يقولها صراحةً بدل أن يُظهرها وكأنها حديثة.


  • تقريب ذكي — الدقة التي تختارها حدّ أدنى لا قيد: إذا كان التقريب سيشوّه المبلغ بأكثر من 2%، تُضاف خانات عشرية تلقائيًا. لا يتحول 0.94 فرنك سويسري إلى «1»، ولا تهبط المبالغ الصغيرة من العملات الرقمية إلى الصفر.


  • أساس متغيّر — تُحتسب الأسعار مقابل العملة التي تحرّرها، لا مقابل عملة ثابتة. بلا تنقّل ذهابًا وإيابًا.


  • بلا إعلانات. بلا حسابات. بلا تتبّع. الإذن الوحيد هو الوصول إلى الإنترنت؛ وقائمتك وترتيبها وإعداداتك لا تغادر جهازك أبدًا.


  العملات


  • أكثر من 300 عملة مع أعلام الدول

  • عملات إقليمية كثيرًا ما تتجاهلها المحوّلات: الروبل الروسي، الدينار الصربي، اللاري الجورجي، السوموني الطاجيكي، السوم القيرغيزي

  • العملات الرقمية — بيتكوين وإيثيريوم وأكثر من 150 غيرها — والمعادن الثمينة


  تفاصيل يومية


  • اكتب في أي حقل فتتحدّث بقية العملات فورًا

  • اسحب الصفوف من المقبض لإعادة ترتيبها، واحذف أحدها بلمسة واحدة

  • بحث يراعي المصدر: رشّح العملات حسب المزوّد، وانظر أين تتوفر كل منها، وبدّل المصدر بلمسة

  • الدقة: أعداد صحيحة أو 1 أو 2 أو 4 خانات عشرية

  • 40 لغة، الإنجليزية افتراضيًا، مع خيار اتباع لغة الجهاز — وتخطيطات من اليمين إلى اليسار

  • هاتف ولوحي وويب: التطبيق نفسه على iPhone وiPad وAndroid، وكتطبيق ويب تثبّته على الشاشة الرئيسية


  الأسعار المعروضة قيم وسطية استرشادية، وليست تسعيرات تداول لحظية.

  Rates By Exchange Rate API.

