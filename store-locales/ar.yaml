whats_new: "‏زر «تبديل المصدر والإضافة» يضيف العملة الآن فعلًا ويبدّل مصدر الأسعار. وبعد إغلاق لوحة المفاتيح تعود القائمة في كل مرة إلى موضعها السابق تمامًا."
