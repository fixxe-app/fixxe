title: "FIXXE – Valutakalkulator"
subtitle: Kurser fra fem kilder
short_description: Middelkurser fra 5 kilder, 300+ valutaer, virker offline, uten reklame.
keywords: "valuta,omregner,vekslingskurs,kurs,penger,reise,forex,krypto,økonomi,euro,fixer,fixe"
promotional_text: Fem kurskilder med automatisk bytte, offlinekurser som varsler når de blir gamle, og avrunding som ikke ødelegger små beløp.
description: 'FIXXE er en rask og ryddig valutakalkulator med ferske middelkurser — det nøytrale midtpunktet mellom verdens kjøps- og salgspriser, uten bankpåslag.


  DETTE GJØR FIXXE ANNERLEDES


  • Fem kurskilder med automatisk bytte — Coinbase, FXRatesAPI, ExchangeRate-API, F.A. og Frankfurter (ESB). Om en leverandør er nede, går appen stille over til den neste og viser hvor tallene kommer fra. De fleste kalkulatorer henger på ett eneste API og viser rett og slett ingenting når det svikter. Foretrekker du én kilde? Velg den i Innstillinger — de andre blir værende som reserve.


  • Virker offline — de siste kursene blir liggende på enheten, så appen regner videre uten forbindelse. Og er kursene mer enn et døgn gamle, sier den det rett ut i stedet for å la dem gå for å være ferske.


  • Smart avrunding — presisjonen du velger er et minimum, ikke en tvangstrøye: ville avrundingen forvrenge beløpet med mer enn 2 %, legges desimaler til av seg selv. 0,94 CHF blir aldri «1», og små kryptobeløp faller aldri til null. Du velger selv hvordan beløp avrundes: opp, så det viste beløpet aldri er mindre enn det faktiske og pengene alltid strekker til, eller til nærmeste.


  • Dynamisk basis — kursene regnes om mot valutaen du redigerer, ikke mot en fast. Ingen fram og tilbake.


  • Husker beløpet — lukk appen, og tallet du skrev er der fortsatt når du kommer tilbake. Velg i innstillingene hvor lenge: 12 eller 24 timer, alltid eller bare mens appen er åpen.


  • Kursjustering — angi en prosentsats for bankens gebyr, margin eller tap ved overføring (for eksempel +1,5 %), så viser alle beløp straks det reelle resultatet. Justerte tall er tydelig merket, slik at du aldri forveksler dem med markedskursen. Med mindre du har den alltid på, slår den seg av selv etter fire timer uten bruk, så et glemt gebyr aldri forvrenger morgendagens tall.


  • Ingen reklame. Ingen kontoer. Ingen sporing. Eneste tillatelse er internettilgang; listen din, rekkefølgen og innstillingene forlater aldri enheten.


  VALUTAER


  • 300+ valutaer med landflagg

  • Regionale valutaer som kalkulatorer ofte hopper over: russisk rubel, serbisk dinar, georgisk lari, tadsjikisk somoni, kirgisisk som

  • Krypto — Bitcoin, Ethereum og 150+ til — og edle metaller


  HVERDAGSDETALJER


  • Skriv i et hvilket som helst felt, og alle andre valutaer oppdateres med én gang

  • Dra rader i håndtaket for å endre rekkefølgen, fjern en med ett trykk

  • Kildebevisst søk: filtrer valutaer etter leverandør, se hvor hver enkelt finnes, bytt kilde med ett trykk

  • Presisjon: hele tall, 1, 2 eller 4 desimaler

  • Tusenskille med mellomrom eller komma: 1 234.56 eller 1,234.56

  • Lyst eller mørkt tema, eller følg systemet

  • 40 språk, engelsk som standard, med mulighet for å følge språket på enheten — også oppsett fra høyre mot venstre

  • Telefon, nettbrett og web: den samme appen på iPhone, iPad, Android og som nettapp du kan legge på startskjermen


  Kursene som vises er veiledende middelkurser, ikke handelskurser i sanntid.

  Rates By Exchange Rate API.

  '
