title: "FIXXE – Валутен конвертор"
subtitle: Курсове от пет източника
short_description: Средни курсове от 5 източника, 300+ валути, работи офлайн, без реклами.
keywords: "валута,конвертор,курс,обмен,пари,пътуване,форекс,крипто,финанси,евро,fixer,fixe"
promotional_text: Пет източника на курсове с автоматично превключване, офлайн курсове с предупреждение за давност и закръгляне, което пази малките суми.
description: 'FIXXE е бърз и изчистен валутен конвертор с актуални средни пазарни курсове — неутралната среда между световните цени купува и продава, без банкови надбавки.


  С КАКВО FIXXE Е РАЗЛИЧЕН


  • Пет източника на курсове с автоматично превключване — Coinbase, FXRatesAPI, ExchangeRate-API, F.A. и Frankfurter (ЕЦБ). Ако доставчик падне, приложението тихо минава към следващия и показва откъде идват числата. Повечето конвертори зависят от едно-единствено API и просто не показват нищо, когато то откаже. Предпочитате един източник? Изберете го в настройките — останалите остават като резерв.


  • Работи офлайн — последните курсове остават на устройството, така че приложението смята и без връзка. А ако тези курсове са по-стари от денонощие, го казва направо, вместо да ги представя за актуални.


  • Умно закръгляне — избраната точност е минимум, а не усмирителна риза: ако закръглянето би изкривило сумата с повече от 2%, знаците след десетичната запетая се добавят сами. 0,94 CHF никога не става „1", а малките суми в криптовалути никога не падат до нула. Вие избирате как да се закръглят сумите: нагоре, за да не е показаната сума никога по-малка от реалната и парите винаги да стигат, или до най-близкото.


  • Динамична база — курсовете се преизчисляват спрямо валутата, която редактирате, а не спрямо фиксирана. Без превключване напред-назад.


  • Помни сумата — затворете приложението и въведеното число ще ви чака, когато се върнете. Колко дълго, избирате в настройките: 12 или 24 часа, винаги или само докато приложението е отворено.


  • Корекция на курса — задайте процент за банкова комисиона, марж или загуби при превод (например +1,5%) и всички суми веднага показват реалния резултат. Преизчислените числа са ясно обозначени, за да не ги сбъркате с пазарния курс. Ако не я оставите винаги включена, тя се изключва сама след четири часа без използване, така че забравена комисиона никога не изкривява утрешните числа.


  • Без реклами. Без профили. Без проследяване. Единственото разрешение е достъп до интернет; вашият списък, неговата подредба и настройките никога не напускат устройството.


  ВАЛУТИ


  • 300+ валути със знамена на държави

  • Регионални валути, които конверторите често пропускат: руска рубла, сръбски динар, грузински лари, таджикски сомони, киргизки сом

  • Криптовалути — Bitcoin, Ethereum и още 150+ — и благородни метали


  ВСЕКИДНЕВНИ ДЕТАЙЛИ


  • Пишете в което и да е поле и всички останали валути се обновяват веднага

  • Влачете редовете за дръжката, за да ги подредите, премахвате един с едно докосване

  • Търсене, което знае източниците: филтрирайте валути по доставчик, вижте къде е налична всяка, сменете източника с едно докосване

  • Точност: цели числа, 1, 2 или 4 знака след запетаята

  • Разделител на хилядите — интервал или запетая: 1 234.56 или 1,234.56

  • Светла или тъмна тема, или като системата

  • 40 езика, английски по подразбиране, с опция да следва езика на устройството — включително подредби отдясно наляво

  • Телефон, таблет и уеб: същото приложение на iPhone, iPad, Android и като уеб приложение, което слагате на началния екран


  Показаните курсове са ориентировъчни средни стойности, а не борсови котировки в реално време.

  Rates By Exchange Rate API.

  '
