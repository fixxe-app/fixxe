promotional_text: Cinco fontes de taxas com troca automática, taxas offline com aviso quando envelhecem e um arredondamento que não estraga valores pequenos.
description: 'O FIXXE é um conversor de moedas rápido e limpo, com taxas médias de mercado em tempo real — o ponto neutro entre os preços mundiais de compra e de venda, sem margens bancárias.


  O QUE TORNA O FIXXE DIFERENTE


  • Cinco fontes de taxas com troca automática — Coinbase, FXRatesAPI, ExchangeRate-API, F.A. e Frankfurter (BCE). As taxas ao vivo coincidem com as taxas de referência que você vê na pesquisa na web e nos grandes sites de câmbio. Se um fornecedor cair, a aplicação passa automaticamente para o seguinte e mostra de onde vieram os números. A maioria dos conversores depende de uma única API e, quando ela falha, simplesmente não mostra nada. Prefere uma só fonte? Escolha-a nas Configurações — as outras ficam como reserva.


  • Funciona offline — as últimas taxas ficam no seu dispositivo, por isso a aplicação continua a converter sem ligação. E se essas taxas tiverem mais de um dia, di-lo com todas as letras em vez de as fazer passar por atuais.


  • Arredondamento inteligente — a precisão que escolher é um mínimo, não uma camisa de forças: se o arredondamento distorcer o valor em mais de 2%, somam-se casas decimais sozinhas. 0,94 CHF nunca vira «1» e pequenos valores em cripto nunca caem para zero. É você que escolhe como os valores são arredondados: para cima, para que o valor mostrado nunca seja inferior ao real e o dinheiro chegue sempre, ou para o mais próximo.


  • Base dinâmica — as taxas são recalculadas em relação à moeda que está a editar, não a uma fixa. Sem andar para trás e para a frente.


  • Memoriza o valor — feche a app e o número que escreveu continua lá quando voltar. Escolha nas definições durante quanto tempo: 12 ou 24 horas, sempre ou só enquanto a app estiver aberta.


  • Ajuste da taxa — defina uma percentagem para a comissão do banco, a margem ou as perdas na transferência (por exemplo, +1,5%) e todos os valores mostram de imediato o resultado real. Os valores ajustados ficam claramente assinalados, para nunca os confundir com a taxa de mercado. A menos que o mantenha sempre ativo, desliga-se sozinho após quatro horas sem utilização, para que uma comissão esquecida nunca distorça os números do dia seguinte.


  • Sem anúncios. Sem contas. Sem rastreio. A única permissão é o acesso à internet; a sua lista, a ordem dela e as definições nunca saem do dispositivo.


  MOEDAS


  • 300+ moedas com bandeiras

  • Moedas regionais que os conversores costumam saltar: rublo russo, dinar sérvio, lari georgiano, somoni tajique, som quirguiz

  • Cripto — Bitcoin, Ethereum e mais de 150 — e metais preciosos


  PORMENORES DO DIA A DIA


  • Escreva em qualquer campo e todas as outras moedas atualizam-se de imediato

  • Arraste as linhas pela pega para as reordenar, remova uma com um toque

  • Pesquisa atenta à fonte: filtre moedas por fornecedor, veja onde existe cada uma, mude de fonte com um toque

  • Precisão: números inteiros, 1, 2 ou 4 casas decimais

  • Separador de milhares com espaço ou vírgula: 1 234.56 ou 1,234.56

  • Tema claro ou escuro, ou seguir o sistema

  • 40 idiomas, inglês por omissão, com a opção de seguir o idioma do dispositivo — esquemas da direita para a esquerda incluídos

  • Telemóvel, tablet e web: a mesma aplicação no iPhone, iPad, Android e como aplicação web para instalar no ecrã principal


  As taxas apresentadas são valores médios de referência, não cotações de mercado em tempo real.

  Uma das fontes de taxas de reserva: Rates By Exchange Rate API.

  '
