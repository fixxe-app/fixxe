title: "FIXXE – Конвертор на валути"
subtitle: Курсеви од три извори
short_description: Средни курсеви од 3 извори, 300+ валути, работи офлајн, без реклами.
keywords: валута,конвертор,курс,менување,пари,патување,форекс,крипто,финансии,евро
promotional_text: Три извори на курсеви со автоматска замена, офлајн курсеви со предупредување за старост и заокружување што не ги расипува малите износи.
description: 'FIXXE е брз и прегледен конвертор на валути со живи средни курсеви — неутралната средина меѓу светските куповни и продажни цени, без банкарски маржи.


  ПО ШТО СЕ РАЗЛИКУВА FIXXE


  • Три извори на курсеви со автоматска замена — ExchangeRate-API, F.A. и Frankfurter (ЕЦБ). Ако некој извор падне, апликацијата тивко преминува на следниот и покажува од каде доаѓаат бројките. Повеќето конвертори зависат од едно единствено API и, кога тоа откажува, едноставно не покажуваат ништо.


  • Работи офлајн — последните курсеви остануваат на уредот, па апликацијата пресметува и без врска. А ако тие курсеви се постари од еден ден, тоа го кажува отворено наместо да ги претставува како свежи.


  • Паметно заокружување — избраната прецизност е минимум, а не лудачка кошула: ако заокружувањето би го искривило износот за повеќе од 2%, децималите се додаваат сами. 0,94 CHF никогаш не станува „1", а малите износи во криптовалути никогаш не паѓаат на нула.


  • Динамична основа — курсевите се пресметуваат спрема валутата што ја уредувате, а не спрема фиксна. Без префрлање напред-назад.


  • Без реклами. Без сметки. Без следење. Единствената дозвола е пристап до интернет; вашиот список, неговиот редослед и поставките никогаш не го напуштаат уредот.


  ВАЛУТИ


  • 300+ валути со знамиња на држави

  • Регионални валути што конверторите често ги прескокнуваат: руска рубља, српски денар, грузиски лари, таџикистански сомони, киргиски сом

  • Криптовалути — Bitcoin, Ethereum и уште 150+ — и благородни метали


  СЕКОЈДНЕВНИ ДЕТАЛИ


  • Внесете во кое било поле и сите други валути се ажурираат веднаш

  • Влечете ги редовите за рачката за да го смените редоследот, отстранете еден со еден допир

  • Пребарување свесно за изворот: филтрирајте валути по давател, видете каде е достапна секоја, сменете извор со еден допир

  • Прецизност: цели броеви, 1, 2 или 4 децимали

  • 40 јазици, англиски како стандарден, со можност да го следи јазикот на уредот — вклучувајќи распореди оддесна налево

  • Телефон, таблет и веб: истата апликација на iPhone, iPad, Android и како веб апликација што ја ставате на почетниот екран


  Прикажаните курсеви се ориентациони средни вредности, а не берзански котации во реално време.

  Rates By Exchange Rate API.

  '
whats_new: "„Смени извор и додај“ сега навистина ја додава валутата и го менува изворот на курсевите. Откако ќе ја затворите тастатурата, листата секој пат се враќа точно на претходното место."
