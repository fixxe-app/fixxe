title: "FIXXE – مبدل ارز"
subtitle: نرخ از پنج منبع
short_description: نرخ میانهٔ بازار از ۵ منبع، بیش از ۳۰۰ ارز، کار بدون اینترنت، بدون تبلیغ.
keywords: "ارز,تبدیل,نرخ,صرافی,پول,سفر,فارکس,رمزارز,مالی,یورو,fixer,fixe"
promotional_text: پنج منبع نرخ با جابه‌جایی خودکار، نرخ‌های آفلاین با هشدار کهنگی، و گِرد کردن هوشمند که مبالغ کوچک را خراب نمی‌کند.
description: '‏FIXXE یک مبدل ارز سریع و تمیز با نرخ‌های میانهٔ بازار است — نقطهٔ بی‌طرف میان قیمت‌های خرید و فروش جهانی، بدون حاشیهٔ سود بانک‌ها.


  چه چیزی FIXXE را متفاوت می‌کند


  • پنج منبع نرخ با جابه‌جایی خودکار — Coinbase، FXRatesAPI، ExchangeRate-API و F.A. و Frankfurter (بانک مرکزی اروپا). اگر یک منبع از کار بیفتد، برنامه بی‌سروصدا به بعدی می‌رود و نشان می‌دهد اعداد از کجا آمده‌اند. بیشتر مبدل‌ها به یک رابط برنامه‌نویسی تکیه دارند و با از کار افتادن آن، هیچ چیز نشان نمی‌دهند. یک منبع را ترجیح می‌دهید؟ آن را در تنظیمات انتخاب کنید — بقیه به‌عنوان پشتیبان می‌مانند.


  • بدون اینترنت کار می‌کند — آخرین نرخ‌ها روی دستگاه می‌مانند، پس برنامه بدون اتصال هم محاسبه می‌کند. و اگر آن نرخ‌ها بیش از یک روز قدیمی باشند، همین را صریح می‌گوید، نه اینکه آن‌ها را تازه جلوه دهد.


  • گِرد کردن هوشمند — دقتی که انتخاب می‌کنید کف است، نه قید: اگر گِرد کردن مبلغ را بیش از ۲٪ منحرف کند، رقم‌های اعشاری خودبه‌خود اضافه می‌شوند. ‏۰٫۹۴ فرانک سوئیس هرگز «۱» نمی‌شود و مبالغ کوچک رمزارز هرگز به صفر نمی‌رسند. شیوهٔ گِرد کردن مبالغ را خودتان انتخاب می‌کنید: رو به بالا، تا مبلغ نمایش‌داده‌شده هرگز کمتر از مبلغ واقعی نباشد و پول همیشه کافی باشد، یا به نزدیک‌ترین.


  • پایهٔ پویا — نرخ‌ها نسبت به ارزی که در حال ویرایش آن هستید دوباره حساب می‌شوند، نه نسبت به ارزی ثابت. بی‌نیاز از رفت‌وبرگشت.


  • مبلغ را به خاطر می‌سپارد — برنامه را ببندید و وقتی برگردید، عددی که وارد کرده‌اید سر جایش است. مدت آن را در تنظیمات انتخاب کنید: ۱۲ یا ۲۴ ساعت، همیشه، یا فقط تا وقتی برنامه باز است.


  • تعدیل نرخ — درصدی برای کارمزد بانک، حاشیهٔ سود یا افت انتقال تعیین کنید (مثلاً ‎+1.5%‎) تا همهٔ مبلغ‌ها بی‌درنگ نتیجهٔ واقعی را نشان دهند. ارقام تعدیل‌شده به‌روشنی علامت‌گذاری می‌شوند تا با نرخ بازار اشتباه نشوند. اگر آن را همیشه فعال نگذارید، پس از چهار ساعت بدون استفاده خودبه‌خود خاموش می‌شود تا کارمزدی فراموش‌شده هرگز ارقام فردا را منحرف نکند.


  • بدون تبلیغ. بدون حساب کاربری. بدون ردیابی. تنها اجازهٔ لازم دسترسی به اینترنت است؛ فهرست شما، ترتیب آن و تنظیماتتان هرگز از دستگاه بیرون نمی‌روند.


  ارزها


  • بیش از ۳۰۰ ارز همراه با پرچم کشورها

  • ارزهای منطقه‌ای که مبدل‌ها اغلب نادیده می‌گیرند: روبل روسیه، دینار صربستان، لاری گرجستان، سامانی تاجیکستان، سوم قرقیزستان

  • رمزارزها — بیت‌کوین، اتریوم و بیش از ۱۵۰ مورد دیگر — و فلزات گران‌بها


  جزئیات روزمره


  • در هر کادری بنویسید، بقیهٔ ارزها بی‌درنگ به‌روز می‌شوند

  • ردیف‌ها را از دستگیره بکشید تا جابه‌جا شوند، یکی را با یک ضربه بردارید

  • جست‌وجوی آگاه از منبع: ارزها را بر پایهٔ ارائه‌دهنده پالایش کنید، ببینید هرکدام کجا موجود است، و با یک ضربه منبع را عوض کنید

  • دقت: عدد درست، یک، دو یا چهار رقم اعشار

  • جداکنندهٔ هزارگان با فاصله یا ویرگول: ‎1 234.56‎ یا ‎1,234.56‎

  • پوستهٔ روشن یا تیره، یا مانند سیستم

  • ۴۰ زبان، به‌طور پیش‌فرض انگلیسی، با گزینهٔ پیروی از زبان دستگاه — همراه با چیدمان راست‌به‌چپ

  • گوشی، تبلت و وب: همان برنامه روی iPhone و iPad و Android، و به‌صورت برنامهٔ وب که روی صفحهٔ خانه نصب می‌شود


  نرخ‌های نمایش‌داده‌شده مقادیر میانهٔ مرجع‌اند، نه قیمت‌های معاملاتی لحظه‌ای.

  Rates By Exchange Rate API.

