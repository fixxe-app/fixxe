title: "FIXXE – Döviz Çevirici"
subtitle: Beş kaynaktan kurlar
short_description: 5 kaynaktan piyasa ortalaması kurlar, 300+ para birimi, çevrimdışı, reklamsız.
keywords: "döviz,çevirici,kur,para,seyahat,forex,kripto,finans,hesaplama,euro,fixer,fixe"
promotional_text: Otomatik yedekli beş kur kaynağı, eskidiğinde uyaran çevrimdışı kurlar ve küçük tutarları bozmayan akıllı yuvarlama.
description: 'FIXXE, canlı piyasa ortalaması kurlarla çalışan hızlı ve sade bir döviz çeviricisidir — dünya alış ve satış fiyatlarının tarafsız ortası, banka farkları olmadan.


  FIXXE''Yİ FARKLI KILAN NE


  • Otomatik yedekli beş kur kaynağı — Coinbase, FXRatesAPI, ExchangeRate-API, F.A. ve Frankfurter (AMB). Canlı kurlar, web aramasında ve büyük döviz sitelerinde gördüğünüz referans kurlarla örtüşür. Bir sağlayıcı yanıt vermezse uygulama otomatik olarak bir sonrakine geçer ve sayıların nereden geldiğini gösterir. Çoğu çevirici tek bir API''ye bağlıdır ve o çöktüğünde hiçbir şey göstermez. Tek bir kaynağı mı tercih ediyorsunuz? Ayarlar''dan seçin — diğerleri yedek olarak kalır.


  • Çevrimdışı çalışır — son kurlar cihazınızda saklanır, böylece uygulama bağlantı olmadan da hesaplamayı sürdürür. Bu kurlar bir günden eskiyse, güncelmiş gibi davranmak yerine bunu açıkça söyler.


  • Akıllı yuvarlama — seçtiğiniz hassasiyet bir alt sınırdır, deli gömleği değil: yuvarlama tutarı %2''den fazla saptıracaksa ondalık basamaklar kendiliğinden eklenir. 0,94 CHF asla "1" olmaz, küçük kripto tutarları asla sıfıra inmez. Tutarların nasıl yuvarlanacağını siz seçersiniz: yukarı, böylece gösterilen tutar asla gerçekten az olmaz ve para hep yeter, ya da en yakına.


  • Dinamik temel — kurlar sabit bir para birimine göre değil, düzenlediğiniz para birimine göre yeniden hesaplanır. İleri geri geçmeye gerek yok.


  • Tutarı hatırlar — uygulamayı kapatın, döndüğünüzde yazdığınız sayı yerinde olur. Ne kadar süreyle olacağını ayarlardan seçin: 12 veya 24 saat, her zaman ya da yalnızca uygulama açıkken.


  • Kur düzeltmesi — banka komisyonu, marj veya transfer kayıpları için bir yüzde belirleyin (örneğin +%1,5) ve tüm tutarlar gerçek sonucu hemen göstersin. Düzeltilmiş rakamlar açıkça işaretlenir; piyasa kuruyla karıştırmazsınız. Her zaman açık tutmadığınız sürece dört saat kullanılmadığında kendiliğinden kapanır; böylece unutulan bir komisyon yarının rakamlarını asla bozmaz.


  • Reklam yok. Hesap yok. Takip yok. Tek izin internet erişimi; listeniz, sırası ve ayarlarınız cihazdan asla çıkmaz.


  PARA BİRİMLERİ


  • Ülke bayraklarıyla 300+ para birimi

  • Çeviricilerin sıkça atladığı bölgesel para birimleri: Rus rublesi, Sırp dinarı, Gürcü larisi, Tacik somonisi, Kırgız somu

  • Kripto — Bitcoin, Ethereum ve 150+ diğeri — ve değerli madenler


  GÜNLÜK AYRINTILAR


  • Herhangi bir alana yazın, diğer tüm para birimleri anında güncellensin

  • Satırları tutamacından sürükleyerek sıralayın, tek dokunuşla birini kaldırın

  • Kaynak bilen arama: para birimlerini sağlayıcıya göre süzün, her birinin nerede bulunduğunu görün, tek dokunuşla kaynak değiştirin

  • Hassasiyet: tam sayılar, 1, 2 veya 4 ondalık basamak

  • Binlik ayırıcı olarak boşluk veya virgül: 1 234.56 ya da 1,234.56

  • Açık veya koyu tema ya da sistemle aynı

  • 40 dil, varsayılan İngilizce, cihaz dilini izleme seçeneğiyle — sağdan sola yerleşimler dahil

  • Telefon, tablet ve web: iPhone, iPad, Android''de ve ana ekrana kurabileceğiniz bir web uygulaması olarak aynı uygulama


  Gösterilen kurlar referans niteliğinde piyasa ortalamalarıdır, gerçek zamanlı borsa fiyatları değildir.

  Yedek kur kaynaklarından biri: Rates By Exchange Rate API.

