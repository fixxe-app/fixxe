title: "FIXXE – Währungsrechner"
subtitle: Kurse aus fünf Quellen
short_description: Mittelkurse aus 5 Quellen, 300+ Währungen, offline nutzbar, ohne Werbung.
keywords: "währung,umrechner,wechselkurs,geld,reise,devisen,krypto,finanzen,rechner,euro,fixer,fixe"
promotional_text: Fünf Kursquellen mit automatischem Wechsel, Offline-Kurse mit Hinweis auf veraltete Daten und eine Rundung, die kleine Beträge nicht verfälscht.
description: 'FIXXE ist ein schneller, aufgeräumter Währungsrechner mit aktuellen Mittelkursen — der neutralen Mitte zwischen weltweiten An- und Verkaufspreisen, ohne Bankaufschläge.


  WAS FIXXE ANDERS MACHT


  • Fünf Kursquellen mit automatischem Wechsel — Coinbase, FXRatesAPI, ExchangeRate-API, F.A. und Frankfurter (EZB). Fällt ein Anbieter aus, wechselt die App still zum nächsten und zeigt, woher die Zahlen stammen. Die meisten Rechner hängen an einer einzigen API und zeigen bei Ausfall schlicht nichts an. Lieber eine bestimmte Quelle? Wählen Sie sie in den Einstellungen — die anderen bleiben als Reserve.


  • Funktioniert offline — die letzten Kurse bleiben auf dem Gerät, die App rechnet also auch ohne Verbindung weiter. Und sind diese Kurse älter als einen Tag, sagt sie das deutlich, statt sie als aktuell auszugeben.


  • Kluges Runden — die gewählte Genauigkeit ist ein Minimum, keine Zwangsjacke: Würde das Runden den Betrag um mehr als 2% verzerren, kommen automatisch weitere Nachkommastellen dazu. Aus 0,94 CHF wird nie „1“, und kleine Kryptobeträge fallen nie auf null. Wie gerundet wird, bestimmen Sie: aufrunden, damit der angezeigte Betrag nie unter dem echten liegt und das Geld immer reicht, oder kaufmännisch runden.


  • Dynamische Basis — die Kurse werden auf die Währung bezogen, die Sie gerade bearbeiten, nicht auf eine feste. Kein Hin- und Herschalten.


  • Merkt sich den Betrag — App schließen, und die eingegebene Zahl ist beim Zurückkommen noch da. Wie lange, wählen Sie in den Einstellungen: 12 oder 24 Stunden, immer oder nur solange die App geöffnet ist.


  • Kursanpassung — legen Sie einen Prozentsatz für Bankgebühr, Marge oder Überweisungsverluste fest (z. B. +1,5 %), und alle Beträge zeigen sofort das tatsächliche Ergebnis. Angepasste Werte sind deutlich markiert, damit Sie sie nie mit dem Marktkurs verwechseln. Sofern Sie sie nicht dauerhaft aktiv lassen, schaltet sie sich nach vier Stunden ohne Nutzung selbst ab, damit eine vergessene Gebühr nie die Zahlen von morgen verfälscht.


  • Keine Werbung. Keine Konten. Kein Tracking. Die einzige Berechtigung ist der Internetzugang; Ihre Liste, deren Reihenfolge und Ihre Einstellungen verlassen das Gerät nie.


  WÄHRUNGEN


  • 300+ Währungen mit Länderflaggen

  • Regionale Währungen, die andere Rechner oft auslassen: russischer Rubel, serbischer Dinar, georgischer Lari, tadschikischer Somoni, kirgisischer Som

  • Krypto — Bitcoin, Ethereum und 150+ weitere — sowie Edelmetalle


  FÜRS TÄGLICHE RECHNEN


  • In ein beliebiges Feld tippen, alle anderen Währungen aktualisieren sich sofort

  • Zeilen am Griff ziehen, um sie neu zu ordnen, eine mit einem Tippen entfernen

  • Quellenbewusste Suche: Währungen nach Anbieter filtern, sehen, wo es welche gibt, Quelle mit einem Tippen wechseln

  • Genauigkeit: ganze Zahlen, 1, 2 oder 4 Nachkommastellen

  • Tausendertrennzeichen: Leerzeichen oder Komma, 1 234.56 oder 1,234.56

  • Helles oder dunkles Design oder wie das System

  • 40 Sprachen, Englisch als Standard, auf Wunsch der Gerätesprache folgend — auch mit Rechts-nach-links-Layouts

  • Telefon, Tablet und Web: dieselbe App auf iPhone, iPad, Android und als Web-App für den Startbildschirm


  Die angezeigten Kurse sind Mittelkurse als Richtwert, keine Börsenkurse in Echtzeit.

  Rates By Exchange Rate API.

  '
whats_new: "Neu in den Einstellungen: Betrag merken. Die eingegebene Zahl bleibt nach dem Schließen der App erhalten — standardmäßig 12 Stunden, wahlweise 24 Stunden, immer oder nur solange die App geöffnet ist."
