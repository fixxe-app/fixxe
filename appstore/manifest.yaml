  cs:
    name: FIXXE – Převodník měn
    subtitle: Kurzy ze tří zdrojů
    description: 'FIXXE je rychlý a přehledný převodník měn s aktuálními středními kurzy — neutrálním středem mezi světovými nákupními a prodejními cenami, bez bankovních přirážek.


      ČÍM SE FIXXE LIŠÍ


      • Tři zdroje kurzů s automatickým přepnutím — ExchangeRate-API, F.A. a Frankfurter (ECB). Když poskytovatel neodpovídá, aplikace tiše přejde na další a ukáže, odkud čísla pocházejí. Většina převodníků závisí na jediném API a při jeho výpadku prostě neukáže nic.


      • Funguje offline — poslední kurzy zůstávají v zařízení, takže aplikace počítá i bez připojení. A jsou-li ty kurzy starší než den, řekne to na rovinu, místo aby je vydávala za aktuální.


      • Chytré zaokrouhlování — zvolená přesnost je minimum, ne svěrací kazajka: pokud by zaokrouhlení zkreslilo částku o více než 2 %, desetinná místa se přidají sama. Z 0,94 CHF se nikdy nestane „1“ a malé částky v kryptoměnách nikdy nespadnou na nulu.


      • Dynamický základ — kurzy se přepočítávají vůči měně, kterou právě upravujete, ne vůči pevné. Žádné přepínání sem a tam.


      • Žádné reklamy. Žádné účty. Žádné sledování. Jediné oprávnění je přístup k internetu; váš seznam, jeho pořadí a nastavení zařízení nikdy neopustí.


      MĚNY


      • 300+ měn s vlajkami zemí

      • Regionální měny, které převodníky často vynechávají: ruský rubl, srbský dinár, gruzínské lari, tádžické somoni, kyrgyzský som

      • Kryptoměny — Bitcoin, Ethereum a 150+ dalších — a drahé kovy


      DROBNOSTI PRO KAŽDÝ DEN


      • Pište do kteréhokoli pole a všechny ostatní měny se okamžitě přepočítají

      • Řádky přetahujte za úchyt a měňte jejich pořadí, jeden odeberete jediným klepnutím

      • Hledání znalé zdrojů: filtrujte měny podle poskytovatele, uvidíte, kde je která dostupná, zdroj změníte jedním klepnutím

      • Přesnost: celá čísla, 1, 2 nebo 4 desetinná místa

      • 40 jazyků, výchozí angličtina, s možností řídit se jazykem zařízení — včetně rozložení zprava doleva

      • Telefon, tablet i web: stejná aplikace na iPhonu, iPadu, Androidu a jako webová aplikace, kterou si přidáte na plochu


      Zobrazené kurzy jsou orientační střední hodnoty, nikoli burzovní kotace v reálném čase.

      Rates By Exchange Rate API.

      '
    promotional_text: Tři zdroje kurzů s automatickým přepnutím, offline kurzy s upozorněním na stáří a chytré zaokrouhlování, které nezkazí malé částky.
    keywords: měna,převodník,kurz,směna,peníze,cestování,forex,krypto,finance,euro
    whats_new: „Změnit zdroj a přidat“ nyní měnu opravdu přidá a přepne zdroj kurzů. Po zavření klávesnice se seznam pokaždé vrátí přesně tam, kde byl.
    support_url: https://telebimmer.com/fixxe/
    privacy_policy_url: https://telebimmer.com/fixxe-privacy.html
  da:
    name: FIXXE – Valutaomregner
    subtitle: Kurser fra tre kilder
    description: 'FIXXE er en hurtig og ren valutaomregner med aktuelle middelkurser — det neutrale midtpunkt mellem verdens købs- og salgspriser, uden banktillæg.


      DET HER GØR FIXXE ANDERLEDES


      • Tre kurskilder med automatisk skift — ExchangeRate-API, F.A. og Frankfurter (ECB). Hvis en udbyder er nede, skifter appen stille til den næste og viser, hvor tallene kommer fra. De fleste omregnere hænger på ét enkelt API og viser ganske enkelt intet, når det svigter.


      • Virker offline — de seneste kurser bliver på enheden, så appen regner videre uden forbindelse. Og er kurserne mere end et døgn gamle, siger den det ligeud i stedet for at lade dem gå for at være friske.


      • Smart afrunding — den præcision, du vælger, er et minimum, ikke en spændetrøje: ville afrundingen forvride beløbet med mere end 2%, kommer der decimaler til af sig selv. 0,94 CHF bliver aldrig til „1", og små kryptobeløb falder aldrig til nul.


      • Dynamisk basis — kurserne beregnes i forhold til den valuta, du redigerer, ikke en fast. Ingen frem og tilbage.


      • Ingen reklamer. Ingen konti. Ingen sporing. Den eneste tilladelse er internetadgang; din liste, dens rækkefølge og dine indstillinger forlader aldrig enheden.


      VALUTAER


      • 300+ valutaer med landeflag

      • Regionale valutaer, som omregnere ofte springer over: russisk rubel, serbisk dinar, georgisk lari, tadsjikisk somoni, kirgisisk som

      • Krypto — Bitcoin, Ethereum og 150+ flere — samt ædelmetaller


      HVERDAGENS DETALJER


      • Skriv i et vilkårligt felt, og alle andre valutaer opdateres med det samme

      • Træk rækker i håndtaget for at omarrangere dem, fjern en med et enkelt tryk

      • Kildebevidst søgning: filtrér valutaer efter udbyder, se hvor hver enkelt findes, skift kilde med ét tryk

      • Præcision: hele tal, 1, 2 eller 4 decimaler

      • 40 sprog, engelsk som standard, med mulighed for at følge enhedens sprog — layout fra højre mod venstre inkluderet

      • Telefon, tablet og web: den samme app på iPhone, iPad, Android og som webapp, du kan lægge på hjemmeskærmen


      De viste kurser er vejledende middelkurser, ikke handelskurser i realtid.

      Rates By Exchange Rate API.

      '
    promotional_text: Tre kurskilder med automatisk skift, offlinekurser der advarer når de bliver gamle, og afrunding der ikke ødelægger små beløb.
    keywords: valuta,omregner,vekselkurs,kurs,penge,rejse,forex,krypto,økonomi,euro
    whats_new: “Skift kilde og tilføj” tilføjer nu faktisk valutaen og skifter kurskilde. Når du lukker tastaturet, vender listen hver gang tilbage præcis dertil, hvor den var.
    support_url: https://telebimmer.com/fixxe/
    privacy_policy_url: https://telebimmer.com/fixxe-privacy.html
  de-DE:
    name: FIXXE – Währungsrechner
    subtitle: Kurse aus drei Quellen
    description: 'FIXXE ist ein schneller, aufgeräumter Währungsrechner mit aktuellen Mittelkursen — der neutralen Mitte zwischen weltweiten An- und Verkaufspreisen, ohne Bankaufschläge.


      WAS FIXXE ANDERS MACHT


      • Drei Kursquellen mit automatischem Wechsel — ExchangeRate-API, F.A. und Frankfurter (EZB). Fällt ein Anbieter aus, wechselt die App still zum nächsten und zeigt, woher die Zahlen stammen. Die meisten Rechner hängen an einer einzigen API und zeigen bei Ausfall schlicht nichts an.


      • Funktioniert offline — die letzten Kurse bleiben auf dem Gerät, die App rechnet also auch ohne Verbindung weiter. Und sind diese Kurse älter als einen Tag, sagt sie das deutlich, statt sie als aktuell auszugeben.


      • Kluges Runden — die gewählte Genauigkeit ist ein Minimum, keine Zwangsjacke: Würde das Runden den Betrag um mehr als 2% verzerren, kommen automatisch weitere Nachkommastellen dazu. Aus 0,94 CHF wird nie „1“, und kleine Kryptobeträge fallen nie auf null.


      • Dynamische Basis — die Kurse werden auf die Währung bezogen, die Sie gerade bearbeiten, nicht auf eine feste. Kein Hin- und Herschalten.


      • Keine Werbung. Keine Konten. Kein Tracking. Die einzige Berechtigung ist der Internetzugang; Ihre Liste, deren Reihenfolge und Ihre Einstellungen verlassen das Gerät nie.


      WÄHRUNGEN


      • 300+ Währungen mit Länderflaggen

      • Regionale Währungen, die andere Rechner oft auslassen: russischer Rubel, serbischer Dinar, georgischer Lari, tadschikischer Somoni, kirgisischer Som

      • Krypto — Bitcoin, Ethereum und 150+ weitere — sowie Edelmetalle


      FÜRS TÄGLICHE RECHNEN


      • In ein beliebiges Feld tippen, alle anderen Währungen aktualisieren sich sofort

      • Zeilen am Griff ziehen, um sie neu zu ordnen, eine mit einem Tippen entfernen

      • Quellenbewusste Suche: Währungen nach Anbieter filtern, sehen, wo es welche gibt, Quelle mit einem Tippen wechseln

      • Genauigkeit: ganze Zahlen, 1, 2 oder 4 Nachkommastellen

      • 40 Sprachen, Englisch als Standard, auf Wunsch der Gerätesprache folgend — auch mit Rechts-nach-links-Layouts

      • Telefon, Tablet und Web: dieselbe App auf iPhone, iPad, Android und als Web-App für den Startbildschirm


      Die angezeigten Kurse sind Mittelkurse als Richtwert, keine Börsenkurse in Echtzeit.

      Rates By Exchange Rate API.

      '
    promotional_text: Drei Kursquellen mit automatischem Wechsel, Offline-Kurse mit Hinweis auf veraltete Daten und eine Rundung, die kleine Beträge nicht verfälscht.
    keywords: währung,umrechner,wechselkurs,geld,reise,devisen,krypto,finanzen,rechner,euro
    whats_new: „Quelle wechseln und hinzufügen“ fügt die Währung jetzt wirklich hinzu und wechselt die Kursquelle. Nach dem Schließen der Tastatur steht die Liste jedes Mal genau wieder dort, wo sie war.
    support_url: https://telebimmer.com/fixxe/
    privacy_policy_url: https://telebimmer.com/fixxe-privacy.html
  el:
    name: FIXXE – Μετατροπέας νομισμάτων
    subtitle: Ισοτιμίες από τρεις πηγές
    description: 'Το FIXXE είναι ένας γρήγορος και καθαρός μετατροπέας νομισμάτων με ζωντανές μέσες ισοτιμίες αγοράς — το ουδέτερο μέσο ανάμεσα στις παγκόσμιες τιμές αγοράς και πώλησης, χωρίς τραπεζικά περιθώρια.


      ΤΙ ΚΑΝΕΙ ΤΟ FIXXE ΔΙΑΦΟΡΕΤΙΚΟ


      • Τρεις πηγές ισοτιμιών με αυτόματη εναλλαγή — ExchangeRate-API, F.A. και Frankfurter (ΕΚΤ). Αν μια πηγή πέσει, η εφαρμογή περνά αθόρυβα στην επόμενη και δείχνει από πού προήλθαν οι αριθμοί. Οι περισσότεροι μετατροπείς στηρίζονται σε ένα μόνο API και, όταν αυτό αποτύχει, απλώς δεν δείχνουν τίποτα.


      • Λειτουργεί εκτός σύνδεσης — οι τελευταίες ισοτιμίες μένουν στη συσκευή, οπότε η εφαρμογή συνεχίζει να υπολογίζει χωρίς δίκτυο. Κι αν αυτές οι ισοτιμίες είναι πάνω από μία ημέρα παλιές, το λέει καθαρά αντί να τις παρουσιάζει ως τρέχουσες.


      • Έξυπνη στρογγυλοποίηση — η ακρίβεια που επιλέγετε είναι ελάχιστο όριο, όχι ζουρλομανδύας: αν η στρογγυλοποίηση αλλοίωνε το ποσό πάνω από 2%, τα δεκαδικά προστίθενται μόνα τους. Το 0,94 CHF δεν γίνεται ποτέ «1» και τα μικρά ποσά σε κρυπτονομίσματα δεν μηδενίζονται ποτέ.


      • Δυναμική βάση — οι ισοτιμίες υπολογίζονται ως προς το νόμισμα που επεξεργάζεστε, όχι ως προς ένα σταθερό. Χωρίς συνεχείς εναλλαγές.


      • Χωρίς διαφημίσεις. Χωρίς λογαριασμούς. Χωρίς παρακολούθηση. Η μόνη άδεια είναι η πρόσβαση στο διαδίκτυο· η λίστα σας, η σειρά της και οι ρυθμίσεις δεν φεύγουν ποτέ από τη συσκευή.


      ΝΟΜΙΣΜΑΤΑ


      • 300+ νομίσματα με σημαίες χωρών

      • Περιφερειακά νομίσματα που οι μετατροπείς συχνά παραλείπουν: ρωσικό ρούβλι, σερβικό δηνάριο, γεωργιανό λάρι, τατζικικό σομόνι, κιργιζικό σομ

      • Κρυπτονομίσματα — Bitcoin, Ethereum και 150+ ακόμη — και πολύτιμα μέταλλα


      ΚΑΘΗΜΕΡΙΝΕΣ ΛΕΠΤΟΜΕΡΕΙΕΣ


      • Πληκτρολογήστε σε οποιοδήποτε πεδίο και όλα τα άλλα νομίσματα ενημερώνονται αμέσως

      • Σύρετε τις γραμμές από τη λαβή για να τις αναδιατάξετε, αφαιρέστε μία με ένα άγγιγμα

      • Αναζήτηση με επίγνωση πηγής: φιλτράρετε νομίσματα ανά πάροχο, δείτε πού υπάρχει το καθένα, αλλάξτε πηγή με ένα άγγιγμα

      • Ακρίβεια: ακέραιοι, 1, 2 ή 4 δεκαδικά

      • 40 γλώσσες, αγγλικά από προεπιλογή, με δυνατότητα να ακολουθεί τη γλώσσα της συσκευής — μαζί με διατάξεις από δεξιά προς τα αριστερά

      • Τηλέφωνο, tablet και web: η ίδια εφαρμογή σε iPhone, iPad, Android και ως web εφαρμογή που εγκαθιστάτε στην αρχική οθόνη


      Οι ισοτιμίες που εμφανίζονται είναι ενδεικτικές μέσες τιμές, όχι χρηματιστηριακές τιμές σε πραγματικό χρόνο.

      Rates By Exchange Rate API.

      '
    promotional_text: Τρεις πηγές ισοτιμιών με αυτόματη εναλλαγή, ισοτιμίες εκτός σύνδεσης με προειδοποίηση παλαιότητας και στρογγυλοποίηση που δεν χαλάει τα μικρά ποσά.
    keywords: νόμισμα,μετατροπέας,ισοτιμία,συνάλλαγμα,χρήματα,ταξίδι,forex,κρυπτο,ευρώ
    whats_new: Το «Αλλαγή πηγής και προσθήκη» πλέον προσθέτει πραγματικά το νόμισμα και αλλάζει την πηγή ισοτιμιών. Μόλις κλείσετε το πληκτρολόγιο, η λίστα επιστρέφει κάθε φορά ακριβώς εκεί που ήταν.
    support_url: https://telebimmer.com/fixxe/
    privacy_policy_url: https://telebimmer.com/fixxe-privacy.html
  en-US:
    name: FIXXE – Currency Converter
    subtitle: Live rates from three sources
    description: 'FIXXE is a fast, clean currency converter with live mid-market exchange rates — the neutral midpoint between global buy and sell prices, not bank spreads.


      WHY FIXXE IS DIFFERENT


      • Three rate sources with automatic fallback — ExchangeRate-API, F.A. and Frankfurter (ECB). If a provider is down, the app quietly switches to the next one and shows which source the numbers came from. Most converters depend on a single API and simply show nothing when it fails.


      • Works offline — the last rates are kept on your device, so the app keeps converting with no connection. And if those rates are more than a day old, it says so plainly instead of pretending they are current.


      • Smart rounding — your chosen precision is a minimum, not a straitjacket: if rounding would distort the amount by more than 2%, extra decimals are added automatically. 0.94 CHF never becomes "1", and small crypto amounts never collapse to zero.


      • Dynamic base — rates are recalculated against the currency you are editing, not a fixed one. No switching back and forth.


      • No ads. No accounts. No tracking. The only permission is internet access; your list, order and settings never leave your device.


      CURRENCIES


      • 300+ currencies with country flags

      • Regional currencies that converters often skip: Russian ruble, Serbian dinar, Georgian lari, Tajikistani somoni, Kyrgyz som

      • Crypto — Bitcoin, Ethereum and 150+ more — and precious metals


      EVERYDAY DETAILS


      • Type in any field and every other currency updates instantly

      • Drag rows by the handle to reorder them, remove one with a single tap

      • Source-aware search: filter currencies by provider, see where each one is available, switch source in one tap

      • Precision: whole numbers, 1, 2 or 4 decimals

      • 40 languages, English by default, with an option to follow your device language — right-to-left layouts included

      • Phone, tablet and web: the same app on iPhone, iPad, Android and as a web app you can install to the home screen


      Displayed rates are mid-market reference values, not real-time trading quotes.

      Rates By Exchange Rate API.

      '
    promotional_text: Three rate sources with automatic fallback, offline rates with a staleness warning, and smart rounding that keeps small amounts accurate.
    keywords: currency,converter,exchange,rate,money,travel,forex,crypto,finance,ruble
    whats_new: “Switch source and add” now really adds the currency and switches the rate source. After you close the keyboard, the list returns to exactly where it was — every time.
    support_url: https://telebimmer.com/fixxe/
    privacy_policy_url: https://telebimmer.com/fixxe-privacy.html
