  fi:
    name: FIXXE – Valuuttalaskuri
    subtitle: Kurssit kolmesta lähteestä
    description: 'FIXXE on nopea ja selkeä valuuttamuunnin, jossa on ajantasaiset keskikurssit — puolueeton keskikohta maailman osto- ja myyntihintojen välissä, ilman pankkien katteita.


      MIKÄ TEKEE FIXXESTÄ ERILAISEN


      • Kolme kurssilähdettä automaattisella vaihdolla — ExchangeRate-API, F.A. ja Frankfurter (EKP). Jos palveluntarjoaja kaatuu, sovellus siirtyy hiljaa seuraavaan ja näyttää, mistä luvut ovat peräisin. Useimmat muuntimet nojaavat yhteen ainoaan rajapintaan eivätkä näytä sen kaatuessa yhtään mitään.


      • Toimii ilman verkkoa — viimeisimmät kurssit säilyvät laitteessa, joten sovellus laskee myös yhteydettä. Ja jos kurssit ovat yli vuorokauden vanhoja, se sanoo sen suoraan sen sijaan että esittäisi ne tuoreina.


      • Älykäs pyöristys — valitsemasi tarkkuus on vähimmäismäärä, ei pakkopaita: jos pyöristys vääristäisi summaa yli 2 %, desimaaleja lisätään itsestään. 0,94 CHF ei muutu koskaan ykköseksi eivätkä pienet kryptosummat katoa nollaan.


      • Dynaaminen perusta — kurssit lasketaan sen valuutan suhteen, jota parhaillaan muokkaat, ei kiinteän. Ei edestakaista vaihtamista.


      • Ei mainoksia. Ei tilejä. Ei seurantaa. Ainoa käyttöoikeus on internetyhteys; listasi, sen järjestys ja asetuksesi eivät poistu laitteelta koskaan.


      VALUUTAT


      • 300+ valuuttaa maalippuineen

      • Alueellisia valuuttoja, jotka muuntimet usein ohittavat: Venäjän rupla, Serbian dinaari, Georgian lari, Tadžikistanin somoni, Kirgisian som

      • Kryptot — Bitcoin, Ethereum ja yli 150 muuta — sekä jalometallit


      ARJEN YKSITYISKOHDAT


      • Kirjoita mihin tahansa kenttään, ja kaikki muut valuutat päivittyvät heti

      • Vedä rivejä kahvasta järjestelläksesi ne, poista yksi yhdellä napautuksella

      • Lähteen tunteva haku: suodata valuutat tarjoajan mukaan, näe missä kukin on saatavilla, vaihda lähdettä yhdellä napautuksella

      • Tarkkuus: kokonaisluvut, 1, 2 tai 4 desimaalia

      • 40 kieltä, oletuksena englanti, halutessasi laitteen kielen mukaan — myös oikealta vasemmalle luettavat asettelut

      • Puhelin, tabletti ja web: sama sovellus iPhonessa, iPadissa, Androidissa ja verkkosovelluksena, jonka voit asentaa aloitusnäytölle


      Näytetyt kurssit ovat ohjeellisia keskikursseja, eivät reaaliaikaisia pörssinoteerauksia.

      Rates By Exchange Rate API.

      '
    promotional_text: Kolme kurssilähdettä automaattisella vaihdolla, offline-kurssit vanhenemisvaroituksella ja pyöristys, joka ei pilaa pieniä summia.
    keywords: valuutta,muunnin,valuuttakurssi,kurssi,raha,matkailu,forex,krypto,talous,euro
    whats_new: ”Vaihda lähde ja lisää” nyt todella lisää valuutan ja vaihtaa kurssilähteen. Kun suljet näppäimistön, luettelo palaa joka kerta täsmälleen entiselle paikalleen.
    support_url: https://telebimmer.com/fixxe/
    privacy_policy_url: https://telebimmer.com/fixxe-privacy.html
  fr-FR:
    name: FIXXE – Convertisseur devises
    subtitle: Taux de trois sources
    description: 'FIXXE est un convertisseur de devises rapide et épuré, avec des taux interbancaires en direct — le point médian neutre entre les prix mondiaux d''achat et de vente, sans marge bancaire.


      CE QUI DISTINGUE FIXXE


      • Trois sources de taux avec bascule automatique — ExchangeRate-API, F.A. et Frankfurter (BCE). Si un fournisseur tombe, l''application passe discrètement au suivant et indique d''où viennent les chiffres. La plupart des convertisseurs dépendent d''une seule API et n''affichent plus rien dès qu''elle flanche.


      • Fonctionne hors ligne — les derniers taux restent sur votre appareil, l''application continue donc de convertir sans connexion. Et si ces taux datent de plus d''une journée, elle le dit clairement au lieu de les faire passer pour récents.


      • Arrondi intelligent — la précision choisie est un minimum, pas un carcan : si l''arrondi déformait le montant de plus de 2 %, des décimales s''ajoutent d''elles-mêmes. 0,94 CHF ne devient jamais « 1 », et les petits montants en crypto ne tombent jamais à zéro.


      • Base dynamique — les taux sont recalculés par rapport à la devise que vous modifiez, pas à une devise figée. Plus besoin de basculer sans cesse.


      • Pas de publicité. Pas de compte. Pas de pistage. La seule autorisation demandée est l''accès à Internet ; votre liste, son ordre et vos réglages ne quittent jamais l''appareil.


      DEVISES


      • 300+ devises avec drapeaux

      • Des devises régionales que les convertisseurs oublient souvent : rouble russe, dinar serbe, lari géorgien, somoni tadjik, som kirghize

      • Crypto — Bitcoin, Ethereum et 150+ autres — et métaux précieux


      AU QUOTIDIEN


      • Saisissez dans n''importe quel champ, toutes les autres devises se mettent à jour aussitôt

      • Réordonnez les lignes en les tirant par la poignée, supprimez-en une d''une seule touche

      • Recherche consciente des sources : filtrez les devises par fournisseur, voyez où chacune existe, changez de source d''une touche

      • Précision : nombres entiers, 1, 2 ou 4 décimales

      • 40 langues, anglais par défaut, avec une option pour suivre la langue de l''appareil — mises en page de droite à gauche comprises

      • Téléphone, tablette et web : la même application sur iPhone, iPad, Android et en application web à installer sur l''écran d''accueil


      Les taux affichés sont des valeurs interbancaires de référence, et non des cotations de marché en temps réel.

      Rates By Exchange Rate API.

      '
    promotional_text: Trois sources de taux avec bascule automatique, taux hors ligne signalés quand ils datent, et un arrondi intelligent qui préserve les petits montants.
    keywords: devise,convertisseur,taux,change,argent,voyage,forex,crypto,finance,euro
    whats_new: « Changer de source et ajouter » ajoute désormais vraiment la devise et change la source des taux. Après la fermeture du clavier, la liste revient à chaque fois exactement à sa place.
    support_url: https://telebimmer.com/fixxe/
    privacy_policy_url: https://telebimmer.com/fixxe-privacy.html
