    description: 'FIXXEは、実勢の仲値レートで動く速くて見やすい通貨換算アプリです。仲値とは世界の買値と売値のちょうど中間で、銀行の上乗せを含みません。


      FIXXEが違うところ


      • 自動で切り替わる3つのレート情報源 — ExchangeRate-API、F.A.、Frankfurter（ECB）。ある提供元が落ちてもアプリは静かに次へ切り替え、数字の出どころを表示します。多くの換算アプリは単一のAPIに頼り、それが止まると何も表示できません。


      • オフラインでも動く — 最後のレートは端末に残るので、通信がなくても計算を続けられます。そのレートが1日以上前のものなら、新しいふりをせずにはっきりそう伝えます。


      • 賢い丸め — 選んだ桁数は下限であって拘束ではありません。丸めによって金額が2%以上ずれる場合は、小数点以下が自動で増えます。0.94 CHFが「1」になることはなく、少額の暗号資産がゼロに潰れることもありません。


      • 動く基準通貨 — レートは固定通貨ではなく、いま入力している通貨を基準に計算し直されます。行ったり来たりの切り替えは不要です。


      • 広告なし。アカウントなし。追跡なし。必要な権限はインターネット接続だけで、通貨の一覧も並び順も設定も端末から出ません。


      通貨


      • 国旗付きで300以上の通貨

      • 他の換算アプリが抜かしがちな地域通貨 — ロシア・ルーブル、セルビア・ディナール、ジョージア・ラリ、タジキスタン・ソモニ、キルギス・ソム

      • 暗号資産 — ビットコイン、イーサリアムほか150以上 — と貴金属


      毎日使うための工夫


      • どの欄に入力しても、ほかの通貨がその場で更新されます

      • 行はハンドルをつかんで並べ替え、ひとつ消すのはワンタップ

      • 情報源を踏まえた検索 — 提供元で通貨を絞り込み、どこで扱っているかを確認し、ワンタップで情報源を切り替え

      • 精度は整数、小数1桁、2桁、4桁から

      • 40言語に対応、既定は英語、端末の言語に合わせる設定も — 右から左に書く言語のレイアウトも含みます

      • スマートフォン、タブレット、ウェブ — iPhone、iPad、Androidで同じアプリ、ホーム画面に追加できるウェブアプリとしても


      表示されるレートは参考用の仲値であり、リアルタイムの取引値ではありません。

      Rates By Exchange Rate API.

      '
    promotional_text: 自動で切り替わる3つのレート情報源、古くなると知らせるオフラインレート、そして少額を崩さない賢い丸め。
    keywords: 通貨,換算,為替,レート,両替,旅行,外国為替,暗号資産,金融,円
    whats_new: 「ソースを切り替えて追加」で、通貨が正しく追加され、レートのソースも切り替わるようになりました。キーボードを閉じると、リストは毎回ぴったり元の位置に戻ります。
    support_url: https://telebimmer.com/fixxe/
    privacy_policy_url: https://telebimmer.com/fixxe-privacy.html
  ko:
    name: FIXXE – 환율 계산기
    subtitle: 세 곳에서 받는 환율
    description: 'FIXXE는 실시간 중간환율로 동작하는 빠르고 깔끔한 환율 계산기입니다. 중간환율은 전 세계 매수가와 매도가의 중립적인 중간값으로, 은행 마진이 섞이지 않습니다.


      FIXXE가 다른 점


      • 자동으로 전환되는 세 곳의 환율 출처 — ExchangeRate-API, F.A., Frankfurter(ECB). 한 곳이 멈추면 앱이 조용히 다음 출처로 넘어가고 숫자가 어디서 왔는지 보여줍니다. 대부분의 계산기는 단 하나의 API에 기대고 있어, 그것이 멈추면 아무것도 보여주지 못합니다.


      • 오프라인에서도 동작 — 마지막 환율이 기기에 남아 있어 연결이 없어도 계산이 이어집니다. 그 환율이 하루보다 오래됐다면 최신인 척하지 않고 분명히 알려줍니다.


      • 똑똑한 반올림 — 선택한 자릿수는 하한이지 족쇄가 아닙니다. 반올림으로 금액이 2% 넘게 틀어질 상황이면 소수 자릿수가 저절로 늘어납니다. 0.94 CHF가 „1"이 되는 일은 없고, 소액 암호화폐가 0으로 사라지지도 않습니다.


      • 바뀌는 기준 통화 — 환율은 고정된 통화가 아니라 지금 입력 중인 통화를 기준으로 다시 계산됩니다. 앞뒤로 전환할 필요가 없습니다.


      • 광고 없음. 계정 없음. 추적 없음. 요구하는 권한은 인터넷 접속 하나뿐이며, 통화 목록과 순서, 설정은 기기를 벗어나지 않습니다.


      통화


      • 국기와 함께 300개 이상의 통화

      • 다른 계산기가 자주 빠뜨리는 지역 통화 — 러시아 루블, 세르비아 디나르, 조지아 라리, 타지키스탄 소모니, 키르기스스탄 솜

      • 암호화폐 — 비트코인, 이더리움 등 150종 이상 — 과 귀금속


      매일 쓰기 좋은 점


      • 어느 칸에 입력해도 나머지 통화가 즉시 바뀝니다

      • 손잡이를 끌어 줄 순서를 바꾸고, 한 번 눌러 하나를 지웁니다

      • 출처를 아는 검색 — 공급처별로 통화를 거르고, 각 통화가 어디에 있는지 확인하고, 한 번 눌러 출처를 바꿉니다

      • 정밀도: 정수, 소수점 1자리, 2자리, 4자리

      • 40개 언어, 기본은 영어, 기기 언어를 따르는 설정도 — 오른쪽에서 왼쪽으로 쓰는 배치까지

      • 휴대폰, 태블릿, 웹 — iPhone, iPad, Android에서 같은 앱, 홈 화면에 설치하는 웹 앱으로도


      표시되는 환율은 참고용 중간값이며, 실시간 거래 호가가 아닙니다.

      Rates By Exchange Rate API.

      '
    promotional_text: 자동으로 전환되는 세 곳의 환율 출처, 오래되면 알려주는 오프라인 환율, 작은 금액을 망치지 않는 똑똑한 반올림.
    keywords: 환율,환전,통화,변환,계산기,여행,외환,암호화폐,금융,원화
    whats_new: ‘소스 전환 후 추가’가 이제 실제로 통화를 추가하고 환율 소스를 바꿉니다. 키보드를 닫으면 목록이 매번 정확히 원래 위치로 돌아갑니다.
    support_url: https://telebimmer.com/fixxe/
    privacy_policy_url: https://telebimmer.com/fixxe-privacy.html
  'no':
    name: FIXXE – Valutakalkulator
    subtitle: Kurser fra tre kilder
    description: 'FIXXE er en rask og ryddig valutakalkulator med ferske middelkurser — det nøytrale midtpunktet mellom verdens kjøps- og salgspriser, uten bankpåslag.


      DETTE GJØR FIXXE ANNERLEDES


      • Tre kurskilder med automatisk bytte — ExchangeRate-API, F.A. og Frankfurter (ESB). Om en leverandør er nede, går appen stille over til den neste og viser hvor tallene kommer fra. De fleste kalkulatorer henger på ett eneste API og viser rett og slett ingenting når det svikter.


      • Virker offline — de siste kursene blir liggende på enheten, så appen regner videre uten forbindelse. Og er kursene mer enn et døgn gamle, sier den det rett ut i stedet for å la dem gå for å være ferske.


      • Smart avrunding — presisjonen du velger er et minimum, ikke en tvangstrøye: ville avrundingen forvrenge beløpet med mer enn 2 %, legges desimaler til av seg selv. 0,94 CHF blir aldri «1», og små kryptobeløp faller aldri til null.


      • Dynamisk basis — kursene regnes om mot valutaen du redigerer, ikke mot en fast. Ingen fram og tilbake.


      • Ingen reklame. Ingen kontoer. Ingen sporing. Eneste tillatelse er internettilgang; listen din, rekkefølgen og innstillingene forlater aldri enheten.


      VALUTAER


      • 300+ valutaer med landflagg

      • Regionale valutaer som kalkulatorer ofte hopper over: russisk rubel, serbisk dinar, georgisk lari, tadsjikisk somoni, kirgisisk som

      • Krypto — Bitcoin, Ethereum og 150+ til — og edle metaller


      HVERDAGSDETALJER


      • Skriv i et hvilket som helst felt, og alle andre valutaer oppdateres med én gang

      • Dra rader i håndtaket for å endre rekkefølgen, fjern en med ett trykk

      • Kildebevisst søk: filtrer valutaer etter leverandør, se hvor hver enkelt finnes, bytt kilde med ett trykk

      • Presisjon: hele tall, 1, 2 eller 4 desimaler

      • 40 språk, engelsk som standard, med mulighet for å følge språket på enheten — også oppsett fra høyre mot venstre

      • Telefon, nettbrett og web: den samme appen på iPhone, iPad, Android og som nettapp du kan legge på startskjermen


      Kursene som vises er veiledende middelkurser, ikke handelskurser i sanntid.

      Rates By Exchange Rate API.

      '
    promotional_text: Tre kurskilder med automatisk bytte, offlinekurser som varsler når de blir gamle, og avrunding som ikke ødelegger små beløp.
    keywords: valuta,omregner,vekslingskurs,kurs,penger,reise,forex,krypto,økonomi,euro
    whats_new: «Bytt kilde og legg til» legger nå faktisk til valutaen og bytter kurskilde. Når du lukker tastaturet, går listen hver gang tilbake nøyaktig dit den var.
    support_url: https://telebimmer.com/fixxe/
    privacy_policy_url: https://telebimmer.com/fixxe-privacy.html
  nl-NL:
    name: FIXXE – Valutacalculator
    subtitle: Koersen uit drie bronnen
    description: 'FIXXE is een snelle, opgeruimde valutaomrekener met actuele middenkoersen — het neutrale midden tussen wereldwijde koop- en verkoopprijzen, zonder bankmarges.


      WAT FIXXE ANDERS MAAKT


      • Drie koersbronnen met automatische wissel — ExchangeRate-API, F.A. en Frankfurter (ECB). Valt een aanbieder uit, dan schakelt de app stilletjes over naar de volgende en laat zien waar de cijfers vandaan komen. De meeste omrekeners hangen aan één API en tonen bij uitval domweg niets.


      • Werkt offline — de laatste koersen blijven op je toestel, dus de app rekent ook zonder verbinding door. En zijn die koersen ouder dan een dag, dan zegt hij dat gewoon in plaats van ze voor actueel te laten doorgaan.


      • Slim afronden — de precisie die je kiest is een minimum, geen keurslijf: zou afronden het bedrag met meer dan 2% vertekenen, dan komen er vanzelf decimalen bij. 0,94 CHF wordt nooit „1" en kleine cryptobedragen vallen nooit terug naar nul.


      • Dynamische basis — koersen worden herberekend ten opzichte van de valuta die je aan het bewerken bent, niet van een vaste. Geen heen-en-weergeschakel.


      • Geen reclame. Geen accounts. Geen tracking. De enige toestemming is internettoegang; je lijst, de volgorde ervan en je instellingen verlaten het toestel nooit.


      VALUTA''S


      • 300+ valuta''s met landenvlaggen

      • Regionale valuta''s die omrekeners vaak overslaan: Russische roebel, Servische dinar, Georgische lari, Tadzjiekse somoni, Kirgizische som

      • Crypto — Bitcoin, Ethereum en 150+ andere — en edelmetalen


      DAGELIJKSE DETAILS


      • Typ in een willekeurig veld en alle andere valuta''s passen zich meteen aan

      • Sleep rijen aan het handvat om ze te ordenen, verwijder er een met één tik

      • Bronbewust zoeken: filter valuta''s per aanbieder, zie waar elke valuta bestaat, wissel van bron met één tik

      • Precisie: hele getallen, 1, 2 of 4 decimalen

      • 40 talen, standaard Engels, met de optie de taal van je toestel te volgen — inclusief indelingen van rechts naar links

      • Telefoon, tablet en web: dezelfde app op iPhone, iPad, Android en als web-app die je op je beginscherm zet


      Getoonde koersen zijn middenkoersen ter referentie, geen handelskoersen in realtime.

      Rates By Exchange Rate API.

      '
    promotional_text: Drie koersbronnen met automatische wissel, offline koersen met waarschuwing als ze verouderen, en afronding die kleine bedragen heel laat.
    keywords: valuta,omrekenen,wisselkoers,koers,geld,reizen,forex,crypto,financiën,euro
    whats_new: ‘Bron wisselen en toevoegen’ voegt de valuta nu echt toe en wisselt de koersbron. Na het sluiten van het toetsenbord staat de lijst elke keer weer precies waar hij stond.
    support_url: https://telebimmer.com/fixxe/
    privacy_policy_url: https://telebimmer.com/fixxe-privacy.html
  pl:
    name: FIXXE – Przelicznik walut
    subtitle: Kursy z trzech źródeł
    description: 'FIXXE to szybki, przejrzysty przelicznik walut z aktualnymi kursami średnimi — neutralnym środkiem między światowymi cenami kupna i sprzedaży, bez marż bankowych.


      CZYM FIXXE SIĘ WYRÓŻNIA


      • Trzy źródła kursów z automatycznym przełączaniem — ExchangeRate-API, F.A. i Frankfurter (EBC). Gdy dostawca przestaje odpowiadać, aplikacja po cichu przechodzi do następnego i pokazuje, skąd pochodzą liczby. Większość przeliczników opiera się na jednym API i po jego awarii po prostu nic nie pokazuje.


      • Działa offline — ostatnie kursy zostają na urządzeniu, więc aplikacja liczy także bez połączenia. A jeśli te kursy mają więcej niż dobę, mówi o tym wprost, zamiast udawać, że są świeże.


      • Mądre zaokrąglanie — wybrana dokładność to minimum, a nie kaftan bezpieczeństwa: jeśli zaokrąglenie zniekształciłoby kwotę o ponad 2%, miejsca po przecinku dopisują się same. 0,94 CHF nigdy nie zamieni się w „1", a małe kwoty w kryptowalutach nie spadną do zera.


      • Dynamiczna baza — kursy są przeliczane względem waluty, którą właśnie edytujesz, a nie sztywno ustalonej. Bez przeskakiwania tam i z powrotem.


      • Bez reklam. Bez kont. Bez śledzenia. Jedyne uprawnienie to dostęp do internetu; twoja lista, jej kolejność i ustawienia nigdy nie opuszczają urządzenia.


      WALUTY


      • 300+ walut z flagami państw

      • Waluty regionalne, które przeliczniki często pomijają: rubel rosyjski, dinar serbski, lari gruzińskie, somoni tadżyckie, som kirgiski

      • Kryptowaluty — Bitcoin, Ethereum i ponad 150 innych — oraz metale szlachetne


      CODZIENNE SZCZEGÓŁY


      • Wpisuj w dowolnym polu, a pozostałe waluty przeliczają się natychmiast

      • Przeciągaj wiersze za uchwyt, aby zmienić kolejność, usuwaj jednym dotknięciem

      • Wyszukiwanie świadome źródła: filtruj waluty według dostawcy, sprawdź, gdzie jest dostępna każda z nich, zmień źródło jednym dotknięciem

      • Dokładność: liczby całkowite, 1, 2 lub 4 miejsca po przecinku

      • 40 języków, domyślnie angielski, z opcją podążania za językiem urządzenia — łącznie z układami od prawej do lewej

      • Telefon, tablet i sieć: ta sama aplikacja na iPhonie, iPadzie, Androidzie i jako aplikacja internetowa, którą zainstalujesz na ekranie głównym


      Pokazywane kursy to średnie wartości odniesienia, a nie notowania giełdowe w czasie rzeczywistym.

      Rates By Exchange Rate API.

      '
    promotional_text: Trzy źródła kursów z automatycznym przełączaniem, kursy offline z ostrzeżeniem o nieaktualności i zaokrąglanie, które nie psuje małych kwot.
    keywords: waluta,przelicznik,kurs,wymiana,pieniądze,podróż,forex,krypto,finanse,euro
    whats_new: „Zmień źródło i dodaj” teraz naprawdę dodaje walutę i przełącza źródło kursów. Po zamknięciu klawiatury lista za każdym razem wraca dokładnie na swoje miejsce.
    support_url: https://telebimmer.com/fixxe/
    privacy_policy_url: https://telebimmer.com/fixxe-privacy.html
  pt-PT:
    name: FIXXE – Conversor de moedas
    subtitle: Taxas de três fontes
    description: 'O FIXXE é um conversor de moedas rápido e limpo, com taxas médias de mercado em tempo real — o ponto neutro entre os preços mundiais de compra e de venda, sem margens bancárias.


      O QUE TORNA O FIXXE DIFERENTE


      • Três fontes de taxas com troca automática — ExchangeRate-API, F.A. e Frankfurter (BCE). Se um fornecedor cair, a aplicação passa discretamente para o seguinte e mostra de onde vieram os números. A maioria dos conversores depende de uma única API e, quando ela falha, simplesmente não mostra nada.


      • Funciona offline — as últimas taxas ficam no seu dispositivo, por isso a aplicação continua a converter sem ligação. E se essas taxas tiverem mais de um dia, di-lo com todas as letras em vez de as fazer passar por atuais.


      • Arredondamento inteligente — a precisão que escolher é um mínimo, não uma camisa de forças: se o arredondamento distorcer o valor em mais de 2%, somam-se casas decimais sozinhas. 0,94 CHF nunca vira «1» e pequenos valores em cripto nunca caem para zero.


      • Base dinâmica — as taxas são recalculadas em relação à moeda que está a editar, não a uma fixa. Sem andar para trás e para a frente.


      • Sem anúncios. Sem contas. Sem rastreio. A única permissão é o acesso à internet; a sua lista, a ordem dela e as definições nunca saem do dispositivo.


      MOEDAS


      • 300+ moedas com bandeiras

      • Moedas regionais que os conversores costumam saltar: rublo russo, dinar sérvio, lari georgiano, somoni tajique, som quirguiz

      • Cripto — Bitcoin, Ethereum e mais de 150 — e metais preciosos


      PORMENORES DO DIA A DIA


      • Escreva em qualquer campo e todas as outras moedas atualizam-se de imediato

      • Arraste as linhas pela pega para as reordenar, remova uma com um toque

      • Pesquisa atenta à fonte: filtre moedas por fornecedor, veja onde existe cada uma, mude de fonte com um toque

      • Precisão: números inteiros, 1, 2 ou 4 casas decimais

      • 40 idiomas, inglês por omissão, com a opção de seguir o idioma do dispositivo — esquemas da direita para a esquerda incluídos

      • Telemóvel, tablet e web: a mesma aplicação no iPhone, iPad, Android e como aplicação web para instalar no ecrã principal


      As taxas apresentadas são valores médios de referência, não cotações de mercado em tempo real.

      Rates By Exchange Rate API.

      '
    promotional_text: Três fontes de taxas com troca automática, taxas offline com aviso quando envelhecem e um arredondamento que não estraga valores pequenos.
    keywords: moeda,conversor,câmbio,taxa,dinheiro,viagem,forex,cripto,finanças,euro
    whats_new: «Mudar de fonte e adicionar» agora adiciona mesmo a moeda e muda a fonte das taxas. Ao fechar o teclado, a lista volta sempre exatamente para onde estava.
    support_url: https://telebimmer.com/fixxe/
    privacy_policy_url: https://telebimmer.com/fixxe-privacy.html
